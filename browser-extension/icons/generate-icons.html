<!DOCTYPE html>
<html>
<head>
    <title>Générateur d'icônes LesRats</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: white; }
        canvas { border: 1px solid #333; margin: 10px; }
        .icon-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .icon-item { text-align: center; }
        a { color: #f97316; }
        h1 { color: #f97316; }
    </style>
</head>
<body>
    <h1>🐀 Générateur d'icônes LesRats</h1>
    <p>Faites un clic droit sur chaque canvas et "Enregistrer l'image sous..." avec le nom indiqué.</p>

    <div class="icon-container">
        <div class="icon-item">
            <canvas id="icon16" width="16" height="16"></canvas>
            <p>icon16.png</p>
        </div>
        <div class="icon-item">
            <canvas id="icon32" width="32" height="32"></canvas>
            <p>icon32.png</p>
        </div>
        <div class="icon-item">
            <canvas id="icon48" width="48" height="48"></canvas>
            <p>icon48.png</p>
        </div>
        <div class="icon-item">
            <canvas id="icon128" width="128" height="128"></canvas>
            <p>icon128.png</p>
        </div>
    </div>

    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            // Fond orange arrondi
            ctx.fillStyle = '#f97316';
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Texte "R" stylisé
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.65}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('R', size / 2, size / 2 + size * 0.05);
        }

        drawIcon('icon16', 16);
        drawIcon('icon32', 32);
        drawIcon('icon48', 48);
        drawIcon('icon128', 128);
    </script>
</body>
</html>
