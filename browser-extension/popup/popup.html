<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesRats</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../icons/icon128.png" alt="LesRats" width="40" height="40"></div>
      <div class="header-content">
        <h1>LesRats <span id="dev-badge" class="dev-badge" style="display:none;">DEV</span></h1>
        <p class="subtitle">Import & Publish</p>
      </div>
    </header>

    <!-- Connection status -->
    <div id="status-connected" class="status-box status-ok hidden">
      <div class="status-icon">&#x2713;</div>
      <div class="status-text">
        <div class="status-title">Connecte</div>
        <div class="status-detail" id="status-url"></div>
      </div>
    </div>

    <div id="status-disconnected" class="status-box status-warn hidden">
      <div class="status-icon">!</div>
      <div class="status-text">
        <div class="status-title">Non connecte</div>
        <div class="status-detail">Ouvrez votre dashboard et cliquez "Connecter"</div>
      </div>
    </div>

    <!-- Info -->
    <div class="info-section">
      <p class="info-text">Importez depuis les pages produit :</p>
      <div class="info-links">
        <a href="https://fr.aliexpress.com" target="_blank" class="btn btn-secondary">AliExpress</a>
        <a href="https://www.printables.com" target="_blank" class="btn btn-secondary">Printables</a>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-links">
      <a href="#" id="link-dashboard" class="action-link" target="_blank">Ouvrir le dashboard</a>
      <span class="action-sep">&middot;</span>
      <a href="#" id="link-profile" class="action-link" target="_blank">Profil / Tokens</a>
      <span class="action-sep">&middot;</span>
      <a href="settings.html" class="action-link">Config manuelle</a>
    </div>

    <footer>
      <p>v2.0.0</p>
    </footer>
  </div>

  <script src="../lib/secure-storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
