<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesRats</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../icons/icon128.png" alt="LesRats" width="40" height="40"></div>
      <div class="header-content">
        <h1>LesRats <span id="dev-badge" class="dev-badge" style="display:none;">DEV</span></h1>
        <p class="subtitle">Import & Publish</p>
      </div>
      <button class="btn-settings" id="btn-settings" title="Parametres">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"></path>
        </svg>
      </button>
    </header>

    <!-- Info: how to use -->
    <div class="info-section">
      <p class="info-text">Naviguez vers une page produit pour voir le panneau d'import flottant :</p>
      <div class="info-links">
        <a href="https://fr.aliexpress.com" target="_blank" class="btn btn-secondary">AliExpress</a>
        <a href="https://www.printables.com" target="_blank" class="btn btn-secondary">Printables</a>
      </div>
    </div>

    <!-- Raccourci clavier -->
    <div class="shortcut-info">
      <div class="shortcut-label">Raccourci rapide:</div>
      <kbd id="shortcut-key">Alt+Shift+I</kbd>
      <a href="#" id="configure-shortcut" class="configure-link">Configurer</a>
    </div>

    <footer>
      <p>v2.0.0</p>
    </footer>
  </div>

  <script src="../lib/secure-storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
