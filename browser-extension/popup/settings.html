<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesRats - Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    .settings-container {
      padding: 16px;
      min-width: 380px;
    }
    
    .settings-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .settings-header h1 {
      font-size: 18px;
      margin: 0;
      flex: 1;
    }
    
    .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 20px;
      color: #6b7280;
    }
    
    .btn-back:hover {
      color: #374151;
    }
    
    .settings-section {
      margin-bottom: 24px;
    }
    
    .settings-section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .setting-item {
      margin-bottom: 16px;
    }
    
    .setting-item label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    
    .setting-item input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .setting-item input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    
    .setting-item .help-text {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }
    
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    
    .status-indicator.success {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status-indicator.error {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .status-indicator.pending {
      background: #fef3c7;
      color: #92400e;
    }
    
    .btn-test {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    
    .btn-test:hover {
      background: #e5e7eb;
    }
    
    .btn-save {
      width: 100%;
      background: #f97316;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
    }
    
    .btn-save:hover {
      background: #ea580c;
    }
    
    .save-status {
      text-align: center;
      font-size: 13px;
      color: #059669;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .save-status.show {
      opacity: 1;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #d1d5db;
      border-radius: 24px;
      transition: 0.2s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background-color: #f97316;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <div class="settings-header">
      <button class="btn-back" id="btn-back" title="Retour">←</button>
      <h1>Parametres</h1>
    </div>
    
    <div class="settings-section">
      <h2>Connexion API</h2>
      
      <div class="setting-item">
        <label for="api-url">URL du serveur LesRats</label>
        <input type="text" id="api-url" placeholder="https://lesrats.example.com">
        <p class="help-text">L'URL de votre instance LesRats (sans slash final)</p>
      </div>
      
      <div class="setting-item">
        <label for="api-token">Token API</label>
        <input type="password" id="api-token" placeholder="Votre token API">
        <p class="help-text">Generez un token dans Profil > Token Extension</p>
      </div>
      
      <button class="btn-test" id="btn-test">Tester la connexion</button>
      <div id="connection-status"></div>
    </div>
    
    <div class="settings-section">
      <h2>Mode Developpement</h2>

      <div class="setting-item" style="display: flex; align-items: center; gap: 12px;">
        <label class="toggle-switch">
          <input type="checkbox" id="dev-mode-toggle">
          <span class="toggle-slider"></span>
        </label>
        <label for="dev-mode-toggle" style="cursor: pointer; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 0;">
          Activer le mode dev
        </label>
      </div>

      <div id="dev-mode-fields" style="display: none; margin-top: 12px;">
        <div class="setting-item">
          <label for="dev-api-url">URL serveur local</label>
          <input type="text" id="dev-api-url" placeholder="http://localhost:8000" value="http://localhost:8000">
        </div>

        <div class="setting-item">
          <label for="dev-api-token">Token dev</label>
          <input type="password" id="dev-api-token" placeholder="Token de votre instance locale">
          <p class="help-text">Token genere sur votre serveur local</p>
        </div>

        <button class="btn-test" id="btn-test-dev">Tester connexion locale</button>
        <div id="dev-connection-status"></div>
      </div>
    </div>

    <div class="settings-section">
      <h2>Boutique par defaut</h2>
      
      <div class="setting-item">
        <label for="default-shop">Boutique</label>
        <select id="default-shop" style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
          <option value="">Chargement...</option>
        </select>
        <p class="help-text">La boutique selectionnee par defaut pour les imports</p>
      </div>
    </div>
    
    <button class="btn-save" id="btn-save">Enregistrer</button>
    <p class="save-status" id="save-status">Parametres enregistres!</p>
  </div>
  
  <script src="../lib/secure-storage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
